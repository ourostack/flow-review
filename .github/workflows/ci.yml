name: ci

# Tests the engine (each check on fixture pages, the schemas, sharding, agent expectations, the CLI end to end) and
# runs the action as another repository uses it, on the fixture flows, so a release tag always points at a working
# action.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Runs not triggered by a pull request each
# get their own group, so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every test on each engine: the checks' fixture pages, the CLI's runs and the flows open in Chromium, then in WebKit
  # (Safari's and WKWebView's engine). The WebKit job also runs the engine-parity tests, which need both browsers.
  test:
    name: test (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      FLOW_REVIEW_ENGINE: ${{ matrix.engine }}
      FLOW_REVIEW_PARITY: ${{ matrix.engine == 'webkit' && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw
        run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      # Playwright downloads browser builds for the image's OS release (Ubuntu 24.04 and 26.04 builds link different
      # libraries), so the browser cache is kept per release (#23).
      - id: image
        run: echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT" && echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: flow-review-${{ matrix.engine }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      # WebKit's system libraries, kept between runs as the action keeps them (lib/webkit-deps.sh).
      - if: matrix.engine == 'webkit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/flow-review-webkit-deps
          key: flow-review-webkit-deps-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.image }}-${{ steps.pw.outputs.version }}
      - if: matrix.engine == 'webkit'
        timeout-minutes: 8
        run: |
          npx playwright install webkit
          bash lib/webkit-deps.sh ~/.cache/flow-review-webkit-deps npx playwright
      # The constrained-computer tests measure speed, so they run alone, on each platform, in the constrain job.
      - run: node --test test/*.test.mjs

  # The engine-parity tests on macOS, where Playwright's WebKit is closest to WKWebView: the WebKit-only wheel stall
  # fails there too, and the measurements WebKit takes another way agree with Chromium's.
  webkit-mac:
    runs-on: macos-latest
    # This repository's pull requests take turns in one macOS lane: the Ouro Labs enterprise's 50 macOS slots are shared
    # by every org in it (ourostack/gatefold#286). The lane queues and never cancels a running job (GitHub drops only the
    # newest, past 100 waiting); main and dispatch runs get their own group.
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request' && 'flow-review-macos-pr-lane-webkit-mac'
        || format('flow-review-webkit-mac-{0}-{1}', github.run_id, github.run_attempt) }}
      queue: max
    timeout-minutes: 15
    # The runner's headless Chromium has no GPU and drops frames of its own: Linux holds Chromium's smooth baseline, and
    # this job holds the WebKit side of the wheel tests (and both sides of the measurements that don't hang on frames).
    env:
      FLOW_REVIEW_PARITY: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --only-shell chromium && npx playwright install webkit
      - run: node --test test/engine-parity.test.mjs

  # The constrained computer on each platform it supports: the CPU slowdown measured at about 4x, a grandchild slowed
  # as much, the memory cap enforced (Windows, Linux) or detected (macOS), the proxy's latency, and pages throttled.
  constrain:
    runs-on: ${{ matrix.os }}
    # The macOS leg waits in a pull-request lane, like webkit-mac above; the other legs and non-PR runs get their own group.
    concurrency:
      group: >-
        ${{ github.event_name == 'pull_request' && matrix.os == 'macos-latest' && 'flow-review-macos-pr-lane-constrain'
        || format('flow-review-constrain-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index) }}
      queue: max
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: pw
        shell: bash
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/ms-playwright' || runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
          key: flow-review-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.os }}-${{ steps.pw.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
      - run: npm run test:constrain

  # The action on the fixture flows, which fail on purpose: report only here. Each shard runs its share of the cells on
  # Chromium and WebKit, as a product's flow review runs on the engines it ships to.
  action:
    runs-on: ubuntu-latest
    # WebKit's system libraries come from the Ubuntu mirror each time: usually 30 s, sometimes minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          flows: test/fixtures/flows/*.flow.ts test/fixtures/flows/*.flow.json
          shard: ${{ matrix.shard }}
          engine: chromium,webkit
          fail-on: none

  # Microsoft Edge on Windows (WebView2's engine), as the runner has it installed.
  action-msedge:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: review
        uses: ./
        with:
          flows: test/fixtures/flows/*.flow.ts
          engine: msedge
          artifact-name: flow-review-msedge
          fail-on: none
      - shell: bash
        run: |
          node -e 'const r = require("./report/report.json"); const keys = r.units.map((u) => u.key); if (!keys.length || !keys.every((k) => k.endsWith("@msedge")) || !/^\d+\./.test(r.provenance.browsers.msedge ?? "")) { console.error(keys, r.provenance.browsers); process.exit(1); } console.log(`msedge ${r.provenance.browsers.msedge}: ${keys.length} units`)'
          ! grep -q '"check":"step","pass":false' report/findings.jsonl

  merge:
    needs: action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flow-review-*-of-*
          path: shards
      - id: merge
        uses: ./
        with:
          command: merge
          reports: shards/*
          flows: test/fixtures/flows/*.flow.ts test/fixtures/flows/*.flow.json
          engine: chromium,webkit
          fail-on: none
      # Both engines' cells, each exactly once, side by side in the summary.
      - env:
          EXIT_CODE: ${{ steps.merge.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = 0
          node -e 'const r = require("./report/report.json"); const c = r.coverage; if (c.missing.length || c.duplicated.length || c.unexpected.length) process.exit(1); const e = r.engines; if (!e.chromium?.units || e.chromium.units !== e.webkit?.units) { console.error(e); process.exit(1); }'
          grep -q '### By engine' report/summary.md

  # The merge as it runs when a shard was cancelled: shard 2's folder holds no report. The fixture flows fail on
  # nothing here, so their missing cells are failing coverage findings, and the merge still passes.
  merge-cancelled-shard:
    needs: action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flow-review-1-of-2
          path: shards/flow-review-1-of-2
      - run: mkdir -p shards/flow-review-2-of-2
      - id: merge
        uses: ./
        with:
          command: merge
          reports: shards/*
          flows: test/fixtures/flows/*.flow.ts test/fixtures/flows/*.flow.json
          artifact-name: flow-review-cancelled-shard
          fail-on: none
      - env:
          EXIT_CODE: ${{ steps.merge.outputs.exit-code }}
        run: |
          test "$EXIT_CODE" = 0
          grep -q '"check":"coverage"' report/findings.jsonl
          node -e 'const c = require("./report/report.json").coverage; const f = require("fs").readFileSync("report/findings.jsonl", "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l)).filter((x) => x.check === "coverage"); if (!c.advisory.length || c.failing.length || c.missingReports.length !== 1 || f.length !== c.advisory.length || f.some((x) => x.pass)) process.exit(1)'
