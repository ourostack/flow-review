name: constrain-probe
on:
  push:
    branches: [probe-final]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, mech: duty-cycle }
          - { os: ubuntu-latest, mech: duty-cycle }
          - { os: ubuntu-latest, mech: auto }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node probe/load-probe.mjs
        env:
          PROBE_MECH: ${{ matrix.mech }}
